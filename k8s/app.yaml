apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-reservation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-reservation
  template:
    metadata:
      labels:
        app: bus-reservation
    spec:
      containers:
        - name: app
          image: bus-reservation:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: brs
            - name: MYSQL_USER
              value: brs-user
            - name: MYSQL_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bus-reservation-db
                  key: MYSQL_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bus-reservation
spec:
  type: LoadBalancer
  selector:
    app: bus-reservation
  ports:
    - name: http
      port: 80
      targetPort: http
